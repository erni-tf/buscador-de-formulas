# ============================================================================
#  Buscador de Fórmulas — base de datos
# ============================================================================
#  Para añadir un compuesto nuevo, copia un bloque [[compuesto]] (o [[ficha]])
#  y rellena los campos. Después hay que regenerar el HTML con generar.sh.
#
#  Campos:
#    id         = identificador único, sin espacios ni acentos
#    nombre     = nombre principal (el que se muestra y ordena)
#    alias      = otras formas de nombrarlo (todas se pueden buscar)
#    familia    = para el filtro por familia
#                 (si sale en varias páginas: familias = ["éteres", "aromáticos"])
#    smiles     = estructura química en formato SMILES
#    condensada = fórmula semidesarrollada (formato explicado abajo)
#    notas      = aclaraciones que se muestran en la ficha
#
#  Formato de "condensada":
#    grupos:  CH3, CH2, CH, C, O, OH, F, Cl, Br, I, N, NH2, CHO, COOH,
#             NO2, OCH3, OC2H5, Ph, R
#    enlaces: - (simple), = (doble), # (triple)
#    rama vertical arriba: { ... }     rama vertical abajo: [ ... ]
#    ejemplo: CH3-C{=O}-CH2-CH3   ->   CH3-C(=O)-CH2-CH3 con el O arriba
#    Si se deja vacío, se usa la vista de anillo (RDKit).
#
#  Los puntos de unión de las fichas se escriben con "*" en el SMILES.
# ============================================================================

[meta]
version = 1
actualizado = "2026-09-23"

